<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <header>
        <div class="container nav">
            <a href="index.html" class="logo"><i class="fas fa-crown"></i><span>EricMuli</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="login.html">Sign In</a></li>
                <li><a href="register.html" class="active">Register</a></li>
            </ul>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2>Join the Community</h2>
            <p class="sub">Create your account</p>
            <form id="registerForm">
                <label>Full Name</label>
                <input type="text" id="regFullname" placeholder="e.g. John Doe" required>
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username" required>
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="you@example.com" required>
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6">
                <label>Confirm Password</label>
                <input type="password" id="regConfirm" placeholder="Confirm password" required>
                <div class="lang-row">
                    <label for="regLang">Language</label>
                    <select id="regLang">
                        <option value="en">English</option>
                        <option value="sw">Swahili</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                        <option value="ar">العربية</option>
                    </select>
                </div>
                <button type="submit" class="btn"><i class="fas fa-user-plus"></i> Create Account</button>
                <div class="switch">Already have an account? <a href="login.html">Sign In</a></div>
            </form>
        </div>
    </section>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
