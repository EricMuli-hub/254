<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <header>
        <div class="container nav">
            <a href="index.html" class="logo"><i class="fas fa-crown"></i><span>EricMuli</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="login.html" class="active">Sign In</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="sub">Sign in to your account</p>
            <form id="loginForm">
                <label>Username or Email</label>
                <input type="text" id="loginUsername" placeholder="Enter username or email" required>
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
                <div class="lang-row">
                    <label for="loginLang">Language</label>
                    <select id="loginLang">
                        <option value="en">English</option>
                        <option value="sw">Swahili</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                        <option value="ar">العربية</option>
                    </select>
                </div>
                <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                <div class="switch">Don't have an account? <a href="register.html">Create one</a></div>
                <div class="switch"><a href="#" id="forgotPwdLink">Forgot password?</a></div>
            </form>
        </div>
    </section>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
