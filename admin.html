<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <header>
        <div class="container nav">
            <a href="index.html" class="logo"><i class="fas fa-crown"></i><span>EricMuli</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin</a></li>
                <li><a href="#" id="logoutNavBtn" class="btn btn-sm btn-outline">Logout</a></li>
            </ul>
        </div>
    </header>

    <section id="pageAdmin" style="padding-top:120px;">
        <div class="container">
            <h2 class="section-title"><span>Admin</span> Panel</h2>
            <p class="section-sub" style="margin-bottom:24px;">Manage resources, users, and system settings.</p>
            <div style="max-width:600px;">
                <h4><i class="fas fa-upload" style="color:var(--secondary);"></i> Upload Resource</h4>
                <label>Category</label>
                <select id="uploadCategoryAdmin">
                    <option value="photo">Photo</option>
                    <option value="video">Video</option>
                    <option value="document">Document</option>
                </select>
                <label>Title</label>
                <input type="text" id="uploadTitleAdmin" placeholder="Title">
                <label>Description</label>
                <input type="text" id="uploadDescAdmin" placeholder="Description">
                <label>File URL</label>
                <input type="text" id="uploadUrlAdmin" placeholder="https://example.com/file">
                <button class="btn" id="uploadResourceAdminBtn" style="margin-top:12px;width:100%;"><i class="fas fa-check"></i> Upload</button>
                <hr style="border-color:var(--border);margin:24px 0;">
                <h4>👥 Users (<span id="adminUserCount">0</span>)</h4>
                <div id="adminUserList" style="margin-top:12px;"></div>
                <hr style="border-color:var(--border);margin:24px 0;">
                <h4>📊 System Stats</h4>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
                    <div style="background:var(--bg-card);padding:16px;border-radius:var(--radius-sm);border:1px solid var(--border);">
                        <div style="font-size:0.8rem;color:var(--text-muted);">Total Resources</div>
                        <div style="font-size:1.8rem;font-weight:700;" id="adminTotalResources">0</div>
                    </div>
                    <div style="background:var(--bg-card);padding:16px;border-radius:var(--radius-sm);border:1px solid var(--border);">
                        <div style="font-size:0.8rem;color:var(--text-muted);">Total Users</div>
                        <div style="font-size:1.8rem;font-weight:700;" id="adminTotalUsers">0</div>
                    </div>
                </div>
                <div style="margin-top:24px;">
                    <h5>📊 WhatsApp Auto-Reply Status</h5>
                    <div class="wa-status">
                        <i class="fab fa-whatsapp"></i>
                        <span>+245713868382 · +254753051262</span>
                        <span class="offline">(AI auto-reply active)</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>Admin Panel · <strong>Eric Muli</strong></p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
